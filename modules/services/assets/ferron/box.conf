*:8080 {
  # root = 配置目录 (脚本直接住这, 无需符号链接)
  root "CONFIG_DIR_PLACEHOLDER"
  disable_symlinks false
  cgi {
  }
  rewrite "^/bin/(.*)" "/bin.nu/bin/$1" {
    file true
    directory true
    last true
  }
  rewrite "^/box/(.*)" "/box.nu/box/$1" {
    file true
    directory true
    last true
  }
  rewrite "^/cache/(.*)" "/cache.nu/cache/$1" {
    file true
    directory true
    last true
  }
  rewrite "^/(.*)" "/index.nu/$1" {
    file true
    directory true
    last true
  }
  cgi {
    extension ".nu"
    environment "PREFIX_LEN" "1"
    environment "DATA_ROOT" "DATA_ROOT_PLACEHOLDER"
    environment "HOOKS_ROOT" "HOOKS_ROOT_PLACEHOLDER"
    environment "CACHE_ROOT" "CACHE_ROOT_PLACEHOLDER"
    environment "ACL_ROOT" "ACL_ROOT_PLACEHOLDER"
  }
  console_log
}