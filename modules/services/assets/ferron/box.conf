*:8080 {
  # root = 配置目录 (脚本直接住这, 无需符号链接)
  root "CONFIG_DIR_PLACEHOLDER"
  disable_symlinks false
  # SSE: ferron3 引擎层对 CGI 响应做整体缓冲 (native_sockets.rs zerocopy 路径),
  # 模块配置无解; dynamic_compressed false 排除压缩缓冲仍不够
  dynamic_compressed false
  cgi {
  }
  # 专有入口优先
  rewrite "^/bin/(.*)" "/bin.nu/bin/$1" {
    file true
    directory true
    last true
  }
  # 根兜底 → box 主服务 (box.d/<rel>, 无前缀; PREFIX_LEN=1 跳过脚本段后 rel 即完整路径)
  rewrite "^/(.*)" "/box.nu/box/$1" {
    file true
    directory true
    last true
  }
  cgi {
    extension ".nu"
    environment "PREFIX_LEN" "1"
    environment "DATA_ROOT" "DATA_ROOT_PLACEHOLDER"
    environment "HOOKS_ROOT" "HOOKS_ROOT_PLACEHOLDER"
    environment "META_ROOT" "META_ROOT_PLACEHOLDER"
  }
  console_log
}