*:8080 {
  root "~/.box"
  disable_symlinks false
  cgi {
  }
  rewrite "^/bin/(.*)" "/ferron/bin.nu/bin/$1" {
    file true
    directory true
    last true
  }
  rewrite "^/box/(.*)" "/ferron/box.nu/box/$1" {
    file true
    directory true
    last true
  }
  rewrite "^/(.*)" "/ferron/index.nu/$1" {
    file true
    directory true
    last true
  }
  cgi {
    extension ".nu"
    environment "PREFIX_LEN" "1"
  }
  console_log
}
