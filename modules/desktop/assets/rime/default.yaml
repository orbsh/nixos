config_version: '2026-02-06'

# schema_list 由 rime-base.nix 生成的 default.custom.yaml(patch)注入,
# 各方案模块(rime-pinyin / rime-wubi)向 options.rime.schemas 注册。
menu:
  page_size: 5

switcher:
  caption: 〔方案选单〕
  hotkeys:
    - F4
    - Control+grave
    - Control+Shift+grave
  save_options:
    - ascii_punct
    - traditionalization
    - emoji
    - full_shape
    - search_single_char
  fold_options: true
  abbreviate_options: true
  option_list_separator: ' / '

ascii_composer:
  good_old_caps_lock: true
  switch_key:
    Caps_Lock: clear
    Shift_L: commit_code
    Shift_R: noop
    Control_L: noop
    Control_R: noop

punctuator:
  digit_separators: ",.:"
  full_shape:
    ' ' : { commit: ' ' }
    ',' : { commit: ， }
    '.' : { commit: 。 }
    '<' : [ 《, 〈, «, ‹ ]
    '>' : [ 》, 〉, », › ]
    '/' : [ ／, ÷ ]
    '?' : { commit: ？ }
    ";" : { commit: ； }
    ":" : { commit: ： }
    "'" : { pair: [ "'", "'" ] }
    '"' : { pair: [ '"', '"' ] }
    '\\' : [ 、, ＼ ]
    '|' : [ ·, ｜, '§', '¦' ]
    '`' : ｀
    '~' : ～
    '!' : { commit: ！ }
    '@' : [ ＠, ☯ ]
    '#' : [ ＃, ⌘ ]
    '%' : [ ％, '°', '℃' ]
    '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤' ]
    '^' : { commit: …… }
    '&' : ＆
    '*' : [ ＊, ·, ・, ×, ※, ❂ ]
    '(' : （
    ')' : ）
    '-' : －
    '_' : ——
    '+' : ＋
    '=' : ＝
    '[' : [ 「, 【, 〔, ［ ]
    ']' : [ 」, 】, 〕, ］ ]
    '{' : [ 『, 〖, ｛ ]
    '}' : [ 』, 〗, ｝ ]
  half_shape:
    ',' : '，'
    '.' : '。'
    '<' : '《'
    '>' : '》'
    '/' : '/'
    '?' : '？'
    ";" : '；'
    ":" : '：'
    "'" : { pair: [ "'", "'" ] }
    '"' : { pair: [ '"', '"' ] }
    '\\' : '、'
    '|' : '|'
    '`' : '·'
    '~' : '~'
    '!' : '！'
    '@' : '@'
    '#' : '#'
    '%' : '%'
    '$' : '¥'
    '^' : '……'
    '&' : '&'
    '*' : '*'
    '(' : '（'
    ')' : '）'
    '-' : '-'
    '_' : ——
    '+' : '+'
    '=' : '='
    '[' : '【'
    ']' : '】'
    '{' : '「'
    '}' : '」'

recognizer:
  patterns:
    email: "^[a-z][-_.0-9a-z]*@.*$"
    uppercase: "[A-Z][-_+.'0-9A-Za-z]*$"
    url: "^(www[.]|https?:|ftp:|mailto:).*$|^[0-9a-z]+[-_.0-9a-z]*\\.[a-z]+$"

key_binder:
  bindings:
    - {accept: "Control+Shift+1", toggle: ascii_mode, when: always}
    - {accept: "Control+Shift+2", toggle: full_shape, when: always}
    - {accept: "Control+Shift+e", toggle: simplified, when: always}
    - {accept: "Control+Shift+3", toggle: traditionalization, when: always}
    - {accept: "Control+Shift+4", toggle: ascii_punct, when: always}
    - {accept: bracketleft, send: Page_Up, when: paging}
    - {accept: bracketright, send: Page_Down, when: has_menu}
    - {accept: minus, send: Page_Up, when: paging}
    - {accept: equal, send: Page_Down, when: has_menu}
    - {accept: comma, send: comma, when: has_menu}
    - {accept: period, send: period, when: has_menu}
    - {accept: semicolon, send: semicolon, when: has_menu}
    - {accept: apostrophe, send: apostrophe, when: has_menu}
