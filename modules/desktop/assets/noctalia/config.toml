# Noctalia v5 配置（~/.config/noctalia/config.toml，目录下 *.toml 合并）
# 状态栏：底部 + 指针自动隐藏（指针离开后收起，触屏幕下缘再拉出）+ 悬浮于窗口之上（不占排他区）
# 注：曾用 smart_auto_hide（空工作区显示、有窗口隐藏），在有窗口的工作区按 Mod4+I 会显示后立刻收回，故改指针自动隐藏。
# 另：早期在底部开着 auto_hide 会遇到 hover 竞争（贴边触发→立即缩回→需再上移才显示），于是长期放顶部；
# 现在改回底部，若该竞争再现，退路是关掉 auto_hide（常显）或加大 auto_hide_delay_ms。
[bar.default]
position      = "bottom"
auto_hide            = true   # 指针离开状态栏后收起；指针触屏幕下缘再拉出
auto_hide_delay_ms   = 500    # 离开后等 0.5s 再收，从栏上移向窗口时不抖
smart_auto_hide      = false  # 与 auto_hide 互斥且优先级更高；关掉"空工作区才显示"，否则 Mod4+I 会立刻收回
show_on_workspace_switch = false
reserve_space = false   # 不预留排他区：弹出悬浮窗口上层，隐藏不留空条
layer         = "top"   # 普通窗口之上
# 左侧：保留默认 [launcher, wallpaper, workspaces]（含工作区指示器），其后追加 sysmon 折线图
#, "taskbar"
start  = ["workspaces", "sysmon-cpu", "sysmon-mem", "sysmon-download", "sysmon-upload"]
center = ["clock"]
# 右侧：去掉 media（播放器控件），保留其余默认
end = ["tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "launcher", "wallpaper", "control-center", "session"]

[widget.clock]
format = "%m-%d %w %H:%M"

# 壁纸：浏览目录（供选择器候选）+ 默认壁纸；fill_mode=crop 默认缩放覆盖
[wallpaper]
enabled   = true
fill_mode = "crop"
directory = "~/Pictures/wallpaper"

# 去掉浮动面板（含 launcher）的描边；shadow 还原
[shell.panel]
borders = false
shadow  = true

# launcher 的 preview pane 也被 card_borders 画 outline —— 一并去掉（全局影响控制中心/设置的卡片边）
[shell]
card_borders = false

# ── 面板内按键（Noctalia 自己的浮层，含启动器）──
# 方向移动默认是 Up/Down/Left/Right，改成 Alt+hjkl 走 vim 手位。
# 不能绑单字母：启动器搜索框是文本输入框，会先吃掉按键；super 组合被配置加载器直接拒绝。
[keybinds]
up    = [ "Alt+k" ]
down  = [ "Alt+j" ]
left  = [ "Alt+h" ]
right = [ "Alt+l" ]

# ── 插件 ──
# 本地插件放 assets/noctalia/plugins/，部署到 $XDG_DATA_HOME/noctalia/plugins/（见 niri.nix）。
# 必须显式启用；这里写插件 id（author/plugin），不是条目 id。
[plugins]
enabled = [ "local/cwd" ]

# 最近目录：改用 Luau launcher provider（plugins/local/cwd），因为它要两级菜单
# （选目录 → 选打开方式：herdr / neovide / 文件管理器），dmenu 单动作做不到。
# provider 声明在 assets/noctalia/plugins/local/cwd/plugin.toml，prefix = "q"。

# herdr agent/workspace 切换（原 walker 的 menus:herdr；Alt+Space 直达 /h）
# exec 拿到的 {selection} 是「标题<TAB>描述」原样行，脚本自己回查出 value 再跳转
[shell.launcher.dmenu.entry.herdr]
command = "python3 ~/.config/noctalia/herdr.py list"
exec    = "python3 ~/.config/noctalia/herdr.py focus {selection}"
prefix  = "h"
label   = "herdr"
glyph   = "users"
global  = false

# ── 会话动作（状态栏 Session 面板 / 启动器 /session / 控制中心 / 锁屏按钮共用同一份列表）──
# 声明动作数组会整体替换默认五项，故按默认顺序显式列出其余四项：去掉 shutdown。
# 其余字段留空即取内置默认（图标、样式、锁屏快捷键）。
[[shell.session.actions]]
action   = "lock"
shortcut = "1"

[[shell.session.actions]]
action   = "logout"
shortcut = "2"

[[shell.session.actions]]
action   = "lock_and_suspend"
shortcut = "3"

[[shell.session.actions]]
action   = "reboot"
shortcut = "4"

# ── bar 系统监视折线图（stat 名取自 Noctalia 内置 system.monitor）──
# show_value=true：折线旁显示实时数值；CPU/内存/swap 为百分比，net 为流量+单位
[widget.sysmon-cpu]
type           = "sysmon"
stat           = "cpu_usage"
visualization  = "graph"
show_value     = true

[widget.sysmon-mem]
type           = "sysmon"
stat           = "ram_pct"
visualization  = "graph"
show_value     = true

[widget.sysmon-download]
type           = "sysmon"
stat           = "net_rx"
visualization  = "graph"
show_value     = true

[widget.sysmon-upload]
type           = "sysmon"
stat           = "net_tx"
visualization  = "graph"
show_value     = true