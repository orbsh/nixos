# 上游清单：手动维护版本的包与其上游来源
# 由 scripts/upstream.nu 消费。
#
# kind:
#   release = GitHub release 资产，用 fetchurl 拉取（版本 + hash 写在 Nix 文件里）
#   mirror  = 预编译二进制/模型文件，镜像在 box.d（本地文件为权威，Nix 侧记 url + narHash）。
#             下载地址默认由 settings.mirror-base + dest 目录名 + file 推导；条目里写 url 可覆盖。
#   doc     = 不在 Nix 里，只是脚本文本中的版本串（bump 改写站点文件里的那一行；没有产物可 fetch）
#
# hash（Nix 消费者的校验方式，决定怎么算）:
#   flat = pkgs.fetchurl              → nix hash file
#   file = fetchTree type = "file"    → nix hash path（单文件 NAR）
#   tree = fetchTree type = "tarball" → nix-prefetch-url --unpack（解包后的树）
#
# site/version-line/hash-line/url-line：需要改写的文件与锚点（{v} 版本、{h} hash、{u} url）
# upstream：上游地址模板；null = 未知，工具只能算本地文件的 hash，不能自动下载

settings:
  proxy: "http://127.0.0.1:7890"     # GitHub 取最新 tag / 下载资产走本机代理
  # 镜像站前缀：mirror 条目的下载地址默认 = <mirror-base>/<dest 目录名>/<file>，
  # 只有一处；个别条目要指别处就在条目里写完整的 url（覆盖推导值）。
  mirror-base: "http://box.d"

entries:
  # ── release（fetchurl，flat hash）────────────────────────
  ferron:
    kind: release
    repo: ferronweb/ferron
    prerelease: true                   # 本仓跑在 3.x beta/rc，latest（2.8.1）不是目标
    tag: "{v}"
    url: "https://github.com/ferronweb/ferron/releases/download/{v}/ferron-{v}-x86_64-unknown-linux-musl.tar.gz"
    hash: flat
    current: "3.0.0-rc.9"
    site: modules/services/ferron.nix
    version-line: 'ferronVersion = "{v}"'
    hash-line: 'hash = "{h}"'

  rustdesk:
    kind: release
    repo: rustdesk/rustdesk
    tag: "{v}"
    url: "https://github.com/rustdesk/rustdesk/releases/download/{v}/rustdesk-{v}-x86_64.deb"
    hash: flat
    current: "1.5.0"
    site: modules/desktop/units/rustdesk.nix
    version-line: 'version = "{v}"'
    hash-line: 'hash = "{h}"'

  trunk:
    kind: release
    repo: trunk-rs/trunk
    tag: "v{v}"
    url: "https://github.com/trunk-rs/trunk/releases/download/v{v}/trunk-x86_64-unknown-linux-musl.tar.gz"
    hash: flat
    current: "0.22.0"
    site: modules/dev/units/rust.nix
    context: 'pname = "trunk";'        # rust.nix 里 version 行不唯一，用上下文行定位
    version-line: 'version = "{v}"'
    hash-line: 'hash = "{h}"'
    url-line: 'url = "{u}"'

  moli:
    kind: release
    repo: lexmount/moli
    tag: "v{v}"
    url: "https://github.com/lexmount/moli/releases/download/v{v}/moli-x86_64-unknown-linux-gnu.tar.gz"
    hash: flat
    current: "1.1.18"
    site: modules/system/units/moli.nix
    version-line: 'version = "{v}"'
    hash-line: 'hash = "{h}"'

  cert-manager:
    kind: release
    repo: cert-manager/cert-manager
    tag: "v{v}"
    url: "https://github.com/cert-manager/cert-manager/releases/download/v{v}/cert-manager.yaml"
    hash: flat
    current: "1.21.2"
    site: modules/k8s/cert-manager.nix
    version-line: 'certManagerVersion = "v{v}"'   # 站点文件里的值是带 v 的 tag，别按纯版本号写模板
    hash-line: 'hash = "{h}"'

  # ── mirror（box.d 上的文件，narHash）────────────────────
  nushell:
    kind: mirror
    repo: nushell/nushell
    tag: "{v}"
    upstream: "https://github.com/nushell/nushell/releases/download/{v}/nu-{v}-x86_64-unknown-linux-musl.tar.gz"
    dest: "~/pub/Assets/k8s"
    file: "nu-{v}-x86_64-unknown-linux-musl.tar.gz"
    hash: file
    current: "0.116.1"
    site: hosts/workstations/nushell.nix
    url-line: 'url = "{u}"'
    hash-line: 'narHash = "{h}"'

  herdr:
    kind: mirror
    repo: herdrdev/herdr               # 仓库从 ogulcancelik/herdr 迁来（旧名 301）
    tag: "v{v}"
    upstream: "https://github.com/herdrdev/herdr/releases/download/v{v}/herdr-linux-x86_64"
    dest: "~/pub/Assets/nixos"
    file: "herdr-{v}-linux-x86_64"
    hash: file
    current: "0.9.5"
    site: hosts/workstations/herdr.nix
    url-line: 'url = "{u}"'
    hash-line: 'narHash = "{h}"'
    version-line: 'version = "{v}"'

  wanxiang:
    kind: mirror
    repo: amzxyz/RIME-LMDG
    pinned-tag: true                   # 模型挂在固定 LTS tag 下，没有版本序列
    tag: "LTS"                          # 模型文件挂在固定 LTS tag 下，无版本号
    upstream: "https://github.com/amzxyz/RIME-LMDG/releases/download/LTS/wanxiang-lts-zh-hans.gram"
    dest: "~/pub/Assets/nixos"
    file: "wanxiang-lts-zh-hans.gram"
    hash: file
    current: null
    site: hosts/workstations/wanxiang.nix
    hash-line: 'narHash = "{h}"'

  numa:
    kind: mirror
    repo: razvandimescu/numa
    tag: "v{v}"
    upstream: "https://github.com/razvandimescu/numa/releases/download/v{v}/numa-linux-x86_64.tar.gz"
    dest: "~/pub/Assets/nixos"
    file: "numa-linux-x86_64.tar.gz"
    hash: file
    current: "0.24.1"
    sites:                              # 两处：profile 覆盖 + 模块默认值
      - hosts: profiles/workstation.nix
      - default: modules/services/numa.nix
    hash-line: 'narHash = "{h}"'

  jcode:
    kind: mirror
    repo: 1jehuang/jcode
    tag: "v{v}"
    upstream: "https://github.com/1jehuang/jcode/releases/download/v{v}/jcode-linux-x86_64.tar.gz"
    dest: "~/pub/Assets/nixos"
    file: "jcode-linux-x86_64.tar.gz"    # 文件名不带版本（换版本时 bump 需 --force 覆盖）
    hash: file
    current: "0.99.0"
    site: modules/dev/units/jcode.nix
    hash-line: 'narHash = "{h}"'
    version-line: 'version = "{v}"'

  rbw:
    kind: mirror
    repo: doy/rbw
    tag: "{v}"
    upstream: "https://github.com/doy/rbw/releases/download/{v}/rbw_{v}_linux_amd64.tar.gz"
    dest: "~/pub/Assets/nixos"
    file: "rbw_{v}_linux_amd64.tar.gz"
    hash: tree                          # fetchTree type = "tarball"，hash 是解包后的树
    current: "1.15.0"
    site: modules/desktop/units/rbw.nix
    url-line: 'url = "{u}"'
    hash-line: 'narHash = "{h}"'

  vivaldi:
    kind: mirror
    upstream: "https://downloads.vivaldi.com/stable/vivaldi-stable_{v}-1_amd64.deb"
    dest: "~/pub/Assets/nixos"
    file: "vivaldi-stable_{v}-1_amd64.deb"
    hash: file
    current: "8.1.4087.61"              # 只有孤儿实例文件 hosts/workstations/vivaldi.nix 在用
    site: hosts/workstations/vivaldi.nix
    url-line: 'url = "{u}"'
    hash-line: 'narHash = "{h}"'

  wechat:
    kind: mirror
    upstream: "https://dldir1v6.qq.com/weixin/Universal/Linux/WeChatLinux_x86_64.AppImage"
    dest: "~/pub/Assets/nixos"
    file: "WeChatLinux_x86_64.AppImage"
    hash: file
    current: null
    site: modules/desktop/units/wechat.nix
    hash-line: 'narHash = "{h}"'
